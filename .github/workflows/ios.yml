# The iOS app as an installable .ipa, built on GitHub's own macOS runners.
#
# Why here and not in .gitlab-ci.yml: the `build:ios` job there has never run and cannot yet —
# gitlab.com's hosted macOS runners are a Premium/Ultimate feature, so it sits waiting for
# somebody to register a Mac as a project runner and set IOS_RUNNER_TAG. GitHub hands standard
# macOS runners to *public* repositories for free ("usage is free for public repositories that
# use standard GitHub-hosted runners"), so the same unsigned .ipa falls out of a workflow with
# nothing to register and nothing to pay.
#
# What comes out is an *unsigned* .ipa — the thing AltStore / Sideloadly sign with your own
# Apple ID, and the honest maximum without an Apple Developer Program membership. Apple allows
# installing an app outside the App Store no other way (docs/MOBILE.md). A signed build
# (TestFlight, App Store) would add the distribution certificate and provisioning profile as
# repository secrets plus an `xcodebuild -exportArchive` step; none of that is set up here, and
# it could not be tested from the source tree.
#
# The steps mirror .gitlab-ci.yml's build:ios job on purpose, so the two produce the same file
# and do not drift. One difference: that job runs `xcodebuild ... | tail -40` under `set -eu`
# without `pipefail`, which means a failing xcodebuild exits 0 as long as `tail` succeeds — the
# log is truncated and the failure is swallowed. `set -o pipefail` below is there for that.
name: iOS app (.ipa)

on:
  # The button to press: Actions → iOS app (.ipa) → Run workflow → pick a branch.
  workflow_dispatch:
  # A released version ships an .ipa beside the APK, the way the GitLab job intended.
  # Deliberately no `paths:` here — it would apply to tag pushes too and skip a release tag
  # whose commit happened to touch none of the listed files.
  push:
    tags: ['v*']
  # A pull request that touches the app builds a test IPA too, so native fixes can
  # be sideloaded for device validation before anything is merged to main.
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Standard arm64 macOS runner, free on a public repository. Pinned rather than
    # `macos-latest` so a runner-image migration cannot change the toolchain under a release:
    # this image carries CocoaPods 1.17.0 and Xcode 16.4 as the default, with 26.x also
    # installed. `macos-latest` (macOS 26 arm64) works too and tracks forward — move to it
    # deliberately, and re-test, rather than by surprise.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # node:22-alpine in web/Dockerfile and api/Dockerfile, and the Node 22 the test workflow
      # pins. The runner image already caches 22.23.2; the action just makes the choice explicit.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      # VITE_MOBILE=1 build, 180 px media staged into dist/, then `cap sync` — which runs
      # `pod install` here because CocoaPods is on the image (on a machine without it, cap sync
      # warns and silently skips the pods, and the Xcode step is what fails).
      #
      # The script ends by running scripts/check-mobile-bundle.mjs against dist/ and
      # ios/App/App/public, so a web build that sneaked into the same dist/ is caught here
      # rather than inside the .ipa. That is the whole point of that guard.
      #
      # Media: without APP_MEDIA_DIR this stages the 180 px stills and MP4 clips that live in
      # the repository — the size the Gym visual licence allows anywhere, including this
      # artifact. The official release APK is built with APP_MEDIA_DIR pointing at the
      # maintainer's larger private copy; if you hold that licence, export it here the same way
      # (plus VITE_CLIP_EXT=webp for the animated-WebP release clips) to match the release.
      - name: Build the mobile bundle and sync it into ios/
        working-directory: frontend
        run: npm run build:mobile

      # Both numbers come from the same places the Android job reads, so the two apps count the
      # same way: the name from package.json, the build number from versionCode.
      - name: Read the version and the build number
        id: version
        working-directory: frontend
        run: |
          VER="$(node -p "require('./package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | sed -n 1p)"
          if [ -z "$BUILD" ]; then
            echo "::error::could not read versionCode from android/app/build.gradle"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "building openGym $VER ($BUILD)"

      # Unsigned on purpose: CODE_SIGNING_ALLOWED=NO is what makes this buildable with no Apple
      # account at all. MARKETING_VERSION / CURRENT_PROJECT_VERSION override the placeholders
      # (1.0 / 1) baked into project.pbxproj.
      #
      # The log goes to a file and the compiler's own `error:` lines are re-emitted as workflow
      # commands, so a failed archive says *why* in the run summary (and in the check-run
      # annotations) instead of only in a log somebody has to open and scroll. Both runs so far
      # failed with nothing but "Process completed with exit code 65" attached to them, which is a
      # diagnosis round trip per attempt.
      - name: Archive for a generic iOS device
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          mkdir -p build
          LOG=build/xcodebuild.log
          if ! xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.ver }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$LOG" 2>&1; then
            grep -E 'error:' "$LOG" | sort -u | head -40 | sed 's/^/::error::/' || true
            echo "::error::xcodebuild archive failed — the last 40 lines follow"
            tail -40 "$LOG"
            exit 1
          fi
          tail -5 "$LOG"

      # An .ipa is a zip with the .app under Payload/ — that much is still true. The assertions
      # after it are the ones that matter: building the archive is not the same as putting the
      # *mobile* bundle in it, and it is not the same as shipping a widget extension either.
      # check-mobile-bundle verified the source tree; this reads the bundle that actually landed in
      # the package, which is what a phone would open.
      - name: Package the .ipa and prove it holds the mobile bundle
        working-directory: frontend/ios/App
        run: |
          set -eu
          VER="${{ steps.version.outputs.ver }}"
          APP="build/App.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "::error::no App.app in the archive"; exit 1; }

          INDEX="$APP/public/index.html"
          test -f "$INDEX" || { echo "::error::the app has no public/index.html — cap sync did not run"; exit 1; }
          grep -Eq 'name="opengym-flavor"[[:space:]]+content="mobile"' "$INDEX" \
            || { echo "::error::the bundle inside the .ipa is not the mobile build"; exit 1; }
          echo "the packaged bundle is the mobile build"

          # The rest timer's Live Activity (#296) lives in an app extension, and the two ways it can
          # go missing are both silent on a phone: an appex that never got embedded means no card at
          # all, and an app with no App Intents metadata means a card whose buttons do nothing when
          # tapped — `Button(intent:)` cannot resolve an intent the bundle does not describe. Neither
          # fails the build on its own, so they are asserted here instead.
          EXTN="$APP/PlugIns/AppWidgets.appex"
          test -d "$EXTN" || { echo "::error::AppWidgets.appex is not embedded — no lock-screen countdown"; exit 1; }
          test -d "$APP/Metadata.appintents" \
            || { echo "::error::the app has no App Intents metadata — the card's buttons would do nothing"; exit 1; }
          test -d "$EXTN/Metadata.appintents" \
            || { echo "::error::the widget extension has no App Intents metadata"; exit 1; }
          echo "the Live Activity extension and its App Intents metadata are in the package"

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          IPA="$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa"
          zip -qr "$IPA" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "openGym-$VER-unsigned.ipa" | tee "openGym-$VER-unsigned.ipa.sha256"
          ls -lh "openGym-$VER-unsigned.ipa"

      # Upload PR builds too: installation on a real device is the only way to
      # verify Live Activities, notification permissions, and haptics.
      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa-${{ steps.version.outputs.ver }}-unsigned
          path: |
            openGym-*.ipa
            openGym-*.ipa.sha256
          if-no-files-found: error
          retention-days: 7
